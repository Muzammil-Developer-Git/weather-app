<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="weather-card">
    <h1>Weather App 🌤️</h1>
    <p class="subtitle">Check the weather in any city</p>

    <form id="weather-form">
      <input
        type="text"
        id="city-input"
        placeholder="Enter city name..."
        aria-label="City name"
        required
      >
      <button type="submit">Search</button>
    </form>

    <button id="location-btn" class="location-btn" type="button">
      📍 Use My Location
    </button>

    <p id="message" role="status" aria-live="polite"></p>

    <section id="weather-result" class="weather-result" hidden>
      <h2 id="city-name"></h2>
      <div id="weather-icon" class="weather-icon">☀️</div>
      <p id="condition" class="condition"></p>
      <p id="temperature" class="temperature"></p>

      <div class="details">
        <div>
          <span>💧 Humidity</span>
          <strong id="humidity"></strong>
        </div>
        <div>
          <span>🌡️ Feels like</span>
          <strong id="feels-like"></strong>
        </div>
      </div>
    </section>

    <footer>Weather information powered by Open-Meteo</footer>
  </main>
</body>
</html>
